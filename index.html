<!DOCTYPE html>
<html>
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Scan</title>
  <script>
  /* หน้านี้อยู่นอก Apps Script: แทน google.script.run ด้วยการเรียก doPost ของเว็บแอป */
  var API_URL = 'https://script.google.com/macros/s/AKfycbyUkMRlFRvnJBZ4Y1sX0e-cV7Yhd7I4DUqs4PivjF72-4_jAWp_rgjIJ7mhZPw9c3Sw/exec';
  window.google = {
    script: {
      get run() {
        var ok = function () {}, fail = function () {};
        var runner = new Proxy({}, {
          get: function (_, fn) {
            if (fn === 'withSuccessHandler') return function (f) { ok = f; return runner; };
            if (fn === 'withFailureHandler') return function (f) { fail = f; return runner; };
            return function () {
              var args = Array.prototype.slice.call(arguments);
              fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
                .then(function (res) { return res.json(); })
                .then(function (j) { if (j.ok) ok(j.data); else fail(new Error(j.error)); })
                .catch(function (e) { fail(new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่ (' + e.message + ')')); });
            };
          },
        });
        return runner;
      },
    },
  };
</script>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #1d2733; --muted: #6b7684; --line: #e3e7ec;
    --brand: #1f3a5f; --brand-2: #2f5d93;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe; --off-bg: #eef1f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Sarabun', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .narrow { max-width: 440px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grow { flex: 1; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  select.inline, input.inline { width: auto; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--brand); color: #fff; }
  button.secondary { background: #e8edf3; color: var(--brand); }
  button.danger { background: var(--bad); }
  button.block { width: 100%; padding: 13px; font-size: 17px; }
  button:disabled { opacity: .5; cursor: default; }
  .err { background: var(--bad-bg); color: var(--bad); padding: 10px 12px; border-radius: 10px; margin-top: 10px; }
  .hidden { display: none !important; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat .v { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat.bad .v { color: var(--bad); } .stat.warn .v { color: var(--warn); } .stat.ok .v { color: var(--ok); }
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; background: #f8fafc; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .p-ok, .p-working { background: var(--ok-bg); color: var(--ok); }
  .p-late, .p-warn { background: var(--warn-bg); color: var(--warn); }
  .p-absent { background: var(--bad-bg); color: var(--bad); }
  .p-future, .p-waiting { background: var(--info-bg); color: var(--info); }
  .p-off, .p-done { background: var(--off-bg); color: var(--muted); }
  .money td { padding: 6px 0; border: 0; }
  .money .neg { color: var(--bad); }
  .money .total td { border-top: 2px solid var(--line); font-size: 20px; font-weight: 700; padding-top: 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .tabs button { background: #e8edf3; color: var(--brand); white-space: nowrap; }
  .tabs button.on { background: var(--brand); color: #fff; }
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 10; }
  .modal .card { width: 100%; max-width: 560px; }
  .topbar { background: var(--brand); color: #fff; }
  .topbar .wrap { padding-top: 12px; padding-bottom: 12px; }
  .topbar button { background: rgba(255,255,255,.15); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  function api(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || String(e)));
      })[fn].apply(null, args);
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function baht(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function num(n, d) { return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: d == null ? 2 : d }); }
  function $(id) { return document.getElementById(id); }
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { return null; }
  }
</script>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
<script>
  /* จดจำใบหน้าในเบราว์เซอร์ (ไม่ส่งรูปหน้าไปบริการภายนอก ส่งเฉพาะตัวเลข 128 ค่าไปเทียบที่ระบบของเรา) */
  var FACE = {
    MODEL: 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/',
    _ready: null,
    stream: null,

    load: function () {
      if (!this._ready) {
        this._ready = Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(this.MODEL),
          faceapi.nets.faceLandmark68Net.loadFromUri(this.MODEL),
          faceapi.nets.faceRecognitionNet.loadFromUri(this.MODEL),
        ]);
      }
      return this._ready;
    },

    start: function (video) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.reject(new Error('เบราว์เซอร์นี้เปิดกล้องไม่ได้ ลองใช้ Chrome หรือ Safari'));
      }
      var self = this;
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
        .then(function (s) { self.stream = s; video.srcObject = s; return video.play(); })
        .catch(function (e) {
          throw new Error(e && e.name === 'NotAllowedError' ? 'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณากดอนุญาต' : 'เปิดกล้องไม่ได้: ' + (e && e.message || e));
        });
    },

    stop: function (video) {
      if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
      this.stream = null;
      if (video) video.srcObject = null;
    },

    detect: function (video) {
      return faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
        .withFaceLandmarks().withFaceDescriptor();
    },

    descriptor: function (det) {
      return Array.prototype.map.call(det.descriptor, function (v) { return Math.round(v * 1e5) / 1e5; });
    },

    /** หน้าใหญ่พอไหม (กันคนยืนไกล/ติดคนข้างหลัง) */
    bigEnough: function (det, video) { return det.detection.box.width >= video.videoWidth * 0.22; },

    snapshot: function (video) {
      var w = 360, h = Math.round(video.videoHeight * w / video.videoWidth);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(video, 0, 0, w, h);
      return c.toDataURL('image/jpeg', 0.7).split(',')[1];
    },

    /** ตรวจกะพริบตา: ตาเปิด -> ปิด -> เปิด */
    blink: {
      state: 0,
      reset: function () { this.state = 0; },
      ear: function (p) {
        var d = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
        return (d(p[1], p[5]) + d(p[2], p[4])) / (2 * d(p[0], p[3]));
      },
      update: function (landmarks) {
        var e = (this.ear(landmarks.getLeftEye()) + this.ear(landmarks.getRightEye())) / 2;
        if (this.state === 0 && e > 0.26) this.state = 1;
        else if (this.state === 1 && e < 0.2) this.state = 2;
        else if (this.state === 2 && e > 0.24) this.state = 3;
        return this.state === 3;
      },
    },
  };
</script>

  <style>
    body { background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .k { max-width: 520px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
    .head { text-align: center; }
    .shop { font-size: 16px; color: #94a3b8; }
    .clock { font-size: 56px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .date { color: #94a3b8; }
    .cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; }
    .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    .guide { position: absolute; inset: 12% 18%; border: 3px dashed rgba(255,255,255,.35); border-radius: 50%; pointer-events: none; }
    .hint { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; text-align: center; font-size: 18px; font-weight: 600; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
    .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #111827; text-align: center; padding: 20px; }
    .cover button { font-size: 22px; padding: 18px 28px; border-radius: 16px; background: #2563eb; }
    .result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 6px; }
    .result .big { font-size: 30px; font-weight: 700; }
    .result .name { font-size: 26px; font-weight: 700; }
    .result .line { font-size: 19px; }
    .r-in { background: rgba(21, 128, 61, .93); }
    .r-out { background: rgba(29, 78, 216, .93); }
    .r-bad { background: rgba(185, 28, 28, .93); }
    .r-dup { background: rgba(71, 85, 105, .95); }
    .foot button { background: #1e293b; color: #cbd5e1; width: 100%; padding: 14px; }
    .modal .card { background: #fff; color: var(--text); }
  </style>
</head>
<body>
  <div class="k">
    <div class="head">
      <div class="shop" id="shop"></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>

    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="guide"></div>
      <div class="hint" id="hint"></div>
      <div class="cover" id="cover">
        <div id="coverMsg">กำลังเชื่อมต่อ...</div>
        <button id="startBtn" class="hidden">แตะเพื่อเริ่มสแกน</button>
      </div>
      <div class="result hidden" id="result"></div>
    </div>

  </div>

<script>
  var P = Object.fromEntries(new URLSearchParams(location.search));
  var KEY = P.key || '';
  var video = $('video');
  var info = null, running = false, busy = false, pauseUntil = 0, fails = 0, wakeLock = null, hideTimer = null;
  var GEO = null, geoErr = '';

  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    $('date').textContent = d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  setInterval(tick, 1000); tick();

  function hint(t) { $('hint').textContent = t || ''; }

  api('kioskInit', KEY).then(function (i) {
    info = i;
    $('shop').textContent = i.shop;
    $('coverMsg').textContent = i.enrolled ? 'พร้อมสแกนใบหน้า' : 'ยังไม่มีพนักงานลงทะเบียนใบหน้า';
    $('startBtn').classList.remove('hidden');
  }).catch(function (e) {
    $('coverMsg').textContent = e.message;
  });

  $('startBtn').onclick = function () {
    $('startBtn').classList.add('hidden');
    $('coverMsg').innerHTML = '<span class="spinner"></span> กำลังโหลดระบบจดจำใบหน้า...';
    FACE.load().then(function () { return FACE.start(video); }).then(function () {
      $('cover').classList.add('hidden');
      watchGeo();
      keepAwake();
      running = true;
      loop();
    }).catch(function (e) {
      $('coverMsg').textContent = e.message;
      $('startBtn').classList.remove('hidden');
    });
  };

  /** สแกนได้เฉพาะที่ร้าน: ติดตามตำแหน่งเครื่องตลอด ส่งไปเทียบระยะที่ระบบ */
  function watchGeo() {
    if (!info.geo) return;
    if (!navigator.geolocation) { geoErr = 'เครื่องนี้หาตำแหน่งไม่ได้'; return; }
    navigator.geolocation.watchPosition(function (p) {
      GEO = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() };
      geoErr = '';
    }, function (e) {
      geoErr = e.code === 1 ? 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง กรุณากดอนุญาต' : 'หาตำแหน่ง GPS ไม่ได้ ลองใหม่';
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }

  function keepAwake() {
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && running) keepAwake(); });

  function loop() {
    if (!running) return;
    var go = !busy && Date.now() > pauseUntil && video.readyState >= 2;
    if (!go) { setTimeout(loop, 300); return; }
    FACE.detect(video).then(function (det) {
      if (!det) { FACE.blink.reset(); hint('มองกล้องให้เห็นหน้าชัดๆ'); return; }
      if (!FACE.bigEnough(det, video)) { hint('ขยับเข้ามาใกล้อีกนิด'); return; }
      if (info.liveness && !FACE.blink.update(det.landmarks)) { hint('กะพริบตา 1 ครั้ง'); return; }
      if (info.geo && (!GEO || Date.now() - GEO.at > 60000)) { hint(geoErr || 'กำลังหาตำแหน่ง GPS...'); return; }
      return send(det);
    }).catch(function (e) { console.error(e); }).then(function () { setTimeout(loop, 250); });
  }

  function send(det) {
    busy = true;
    hint('กำลังตรวจสอบ...');
    return api('kioskFace', KEY, FACE.descriptor(det), FACE.snapshot(video), info.geo && GEO ? { lat: GEO.lat, lng: GEO.lng, acc: GEO.acc } : null)
      .then(show)
      .catch(function (e) { show({ ok: false, message: e.message }); })
      .then(function () { busy = false; FACE.blink.reset(); });
  }

  /** 'HH:mm' + นาที -> 'HH:mm' */
  function addMin(hhmm, m) {
    var p = String(hhmm).split(':'), t = (Number(p[0]) * 60 + Number(p[1]) + Number(m || 0)) % 1440;
    return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2);
  }

  function show(r) {
    var box = $('result'), html, cls, ms = 5000;
    if (!r.ok) {
      fails++;
      cls = 'r-bad'; ms = 2500;
      html = '<div class="big">✕ ' + esc(r.message || 'ไม่สำเร็จ') + '</div>' +
        '<div class="line">' + (fails >= 3 ? 'ถ้ายังไม่ได้ แจ้งเจ้าของหรือแอดมิน' : 'ลองใหม่อีกครั้ง') + '</div>';
    } else if (r.dup) {
      fails = 0; cls = 'r-dup'; ms = 3500;
      html = '<div class="name">' + esc(r.name) + '</div><div class="line">บันทึก' + ({ IN: 'เข้างาน', BREAK_OUT: 'ออกพัก', BREAK_IN: 'กลับจากพัก', OUT: 'ออกงาน' }[r.action] || '') + 'ไปแล้วเมื่อ ' + esc(r.time) + ' น.</div>';
    } else if (r.action === 'IN') {
      fails = 0; cls = 'r-in';
      html = '<div class="big">✓ เข้างาน ' + esc(r.time) + ' น.</div><div class="name">' + esc(r.name) + '</div>' +
        (r.shift ? '<div class="line">กะ ' + esc(r.shift) + '</div>' : '<div class="line">วันนี้ไม่มีกะในตาราง</div>') +
        (r.lateMin ? '<div class="line">⚠️ สาย ' + r.lateMin + ' นาที (หัก ' + baht(r.lateDeduct) + ' บาท)</div>' : '');
    } else if (r.action === 'BREAK_OUT') {
      fails = 0; cls = 'r-out';
      html = '<div class="big">☕ ออกพัก ' + esc(r.time) + ' น.</div><div class="name">' + esc(r.name) + '</div>' +
        '<div class="line">มีเวลาพัก ' + r.allowMin + ' นาที</div>' +
        '<div class="line">⏰ กลับมาสแกนก่อน ' + addMin(r.time, r.allowMin) + ' น.</div>';
    } else if (r.action === 'BREAK_IN') {
      fails = 0; cls = 'r-in';
      html = '<div class="big">✓ กลับจากพัก ' + esc(r.time) + ' น.</div><div class="name">' + esc(r.name) + '</div>' +
        '<div class="line">พัก ' + r.breakMin + ' นาที' + (r.overMin ? ' ⚠️ เกิน ' + r.overMin + ' นาที (หัก ' + baht(r.overDeduct) + ' บาท)' : '') + '</div>';
    } else {
      fails = 0; cls = 'r-out';
      html = '<div class="big">✓ ออกงาน ' + esc(r.time) + ' น.</div><div class="name">' + esc(r.name) + '</div>' +
        '<div class="line">ทำงาน ' + num(r.workedH, 1) + ' ชม.' + (r.otH ? ' · OT ' + num(r.otH, 1) + ' ชม.' : '') + '</div>';
    }
    box.className = 'result ' + cls;
    box.innerHTML = html;
    hint('');
    pauseUntil = Date.now() + ms;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { box.className = 'result hidden'; }, ms);
  }
</script>
</body>
</html>
